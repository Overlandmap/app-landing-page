ks/152-2fd73542e815d7cb.js\",\"185\",\"static/chunks/app/layout-8ce85eb4fbfa0040.js\"],\"LanguageProvider\"]\ne:I[2572,[\"152\",\"static/chunks/152-2fd73542e815d7cb.js\",\"185\",\"static/chunks/app/layout-8ce85eb4fbfa0040.js\"],\"ColorSchemeProvider\"]\nf:I[376,[\"601\",\"static/chunks/app/error-b3e9baccacd1beb6.js\"],\"default\"]\n11:I[1060,[],\"\"]\nb:[\"id\",\"vgZUTuC9C0KK0XKrAYnz\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L5\",null,{\"buildId\":\"3ac897a1a9281b4e\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"border_post\",\"vgZUTuC9C0KK0XKrAYnz\",\"\"],\"initialTree\":[\"\",{\"children\":[\"border_post\",{\"children\":[[\"id\",\"vgZUTuC9C0KK0XKrAYnz\",\"d\"],{\"children\":[\"__PAGE__?{\\\"id\\\":\\\"vgZUTuC9C0KK0XKrAYnz\\\"}\",{}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"border_post\",{\"children\":[[\"id\",\"vgZUTuC9C0KK0XKrAYnz\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L6\",[\"$\",\"$L7\",null,{\"children\":[\"$\",\"main\",null,{\"className\":\"h-screen relative\",\"children\":[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"div\",null,{\"className\":\"h-screen flex items-center justify-center\",\"children\":\"Loading border post...\"}],\"children\":[\"$\",\"$L9\",null,{\"initialBorderPost\":\"vgZUTuC9C0KK0XKrAYnz\",\"initialBorderPostData\":{\"id\":\"vgZUTuC9C0KK0XKrAYnz\",\"is_open\":1,\"countries\":\"TUR-SYR\",\"location\":{\"_latitude\":36.23123,\"_longitude\":36.69214},\"name\":\"Bab al-Hawa / Cilvegözü\",\"comment\":\"Officially the crossing is restricted (by Turkey) to Turks and Syrians. But as Iraq and Kuwait closed down during the 2026 Iran war, it shortly re-opened to other nationals exiting Syria, provided they can show an outgoing flight from Turkey, but that didn't last long.\\nA few (foreign) vehicles have been able to cross (April 2026), but only after they got their embassy to write a letter to the Turkish foreign ministry asking for an exception for them specifically.\\nSo it is not (yet) to be considered a viable route to/from the Arabic peninsula.\",\"comment_translations\":{\"en\":\"Officially the crossing is restricted (by Turkey) to Turks and Syrians. But as Iraq and Kuwait closed down during the 2026 Iran war, it shortly re-opened to other nationals exiting Syria, provided they can show an outgoing flight from Turkey, but that didn't last long.\\nA few (foreign) vehicles have been able to cross (April 2026), but only after they got their embassy to write a letter to the Turkish foreign ministry asking for an exception for them specifically.\\nSo it is not (yet) to be considered a viable route to/from the Arabic peninsula.\",\"fr\":\"Officiellement, le passage est interdit (par la Turquie) aux Turcs et aux Syriens. Cependant, suite à la fermeture de la frontière irakienne et koweïtienne pendant la guerre Iran-Irak de 2026, elle a brièvement rouvert aux ressortissants d'autres pays quittant la Syrie, à condition qu'ils puissent présenter un billet d'avion au départ de Turquie. Cette mesure fut toutefois de courte durée.\\n\\nQuelques véhicules étrangers ont pu franchir la frontière (avril 2026), mais uniquement après que leur ambassade ait adressé une lettre au ministère turc des Affaires étrangères pour demander une dérogation spécifique.\\n\\nPar conséquent, ce passage ne peut (pas encore) être considéré comme une voie d'accès viable à la péninsule arabique.\",\"de\":\"Offiziell ist der Grenzübergang (von der Türkei) auf Türken und Syrer beschränkt. Da der Irak und Kuwait im Zuge des Iran-Krieges 2026 die Grenze schlossen, wurde sie kurzzeitig für andere Staatsangehörige, die Syrien verließen, wieder geöffnet, sofern sie einen Rückflug aus der Türkei vorweisen konnten. Diese Regelung hielt jedoch nicht lange an.\\nEinige (ausländische) Fahrzeuge konnten die Grenze passieren (April 2026), allerdings nur, nachdem die jeweiligen Botschaften einen Brief an das türkische Außenministerium geschrieben und um eine Ausnahmegenehmigung gebeten hatten.\\nDaher gilt der Grenzübergang (noch) nicht als praktikable Route zur/von der Arabischen Halbinsel.\",\"it\":\"Ufficialmente, il valico è riservato (dalla Turchia) a cittadini turchi e siriani. Tuttavia, con la chiusura di Iraq e Kuwait durante la guerra con l'Iran del 2026, è stato brevemente riaperto anche ad altri cittadini provenienti dalla Siria, a condizione che potessero dimostrare di avere un volo in partenza dalla Turchia, ma questa possibilità non è durata a lungo.\\nAlcuni veicoli (stranieri) sono riusciti ad attraversare il confine (aprile 2026), ma solo dopo che le rispettive ambasciate avevano inviato una lettera al Ministero degli Esteri turco chiedendo un'eccezione specifica.\\nPertanto, non può (ancora) essere considerato un percorso praticabile da/per la penisola arabica.\",\"es\":\"Oficialmente, el cruce fronterizo está restringido (por Turquía) a turcos y sirios. Sin embargo, cuando Irak y Kuwait cerraron el paso durante la guerra con Irán en 2026, se reabrió brevemente a ciudadanos de otras nacionalidades que salían de Siria, siempre que pudieran demostrar un vuelo de salida desde Turquía. No obstante, esta medida no duró mucho.\\n\\nAlgunos vehículos (extranjeros) lograron cruzar (en abril de 2026), pero solo después de que su embajada enviara una carta al Ministerio de Asuntos Exteriores turco solicitando una excepción específica para ellos.\\n\\nPor lo tanto, aún no se considera una ruta viable hacia o desde la península arábiga.\",\"pt\":\"Oficialmente, a travessia é restrita (pela Turquia) a turcos e sírios. Mas, como o Iraque e o Kuwait fecharam suas fronteiras durante a guerra com o Irã em 2026, ela foi brevemente reaberta para cidadãos de outras nacionalidades que saíam da Síria, desde que pudessem apresentar um voo de saída da Turquia, mas isso não durou muito.\\nAlguns veículos (estrangeiros) conseguiram atravessar (em abril de 2026), mas somente depois que suas embaixadas enviaram uma carta ao Ministério das Relações Exteriores da Turquia solicitando uma exceção específica para eles.\\nPortanto, ainda não deve ser considerada uma rota viável para/da Península Arábica.\",\"nl\":\"Officieel is de grensovergang (door Turkije) beperkt tot Turken en Syriërs. Maar toen Irak en Koeweit zich tijdens de oorlog met Iran in 2026 afsloten, werd de grens kortstondig weer opengesteld voor andere nationaliteiten die Syrië verlieten, mits ze een uitgaande vlucht vanuit Turkije konden aantonen. Dit duurde echter niet lang.\\n\\nEen paar (buitenlandse) voertuigen hebben de grens kunnen oversteken (april 2026), maar alleen nadat hun ambassade een brief naar het Turkse ministerie van Buitenlandse Zaken had gestuurd met het specifieke verzoek om een uitzondering.\\n\\nHet is dus (nog) niet te beschouwen als een haalbare route van/naar het Arabische schiereiland.\",\"pl\":\"Oficjalnie przejście graniczne jest ograniczone (przez Turcję) do Turków i Syryjczyków. Jednak po zamknięciu granic Iraku i Kuwejtu podczas wojny z Iranem w 2026 roku, wkrótce ponownie otwarto je dla innych obywateli opuszczających Syrię, pod warunkiem przedstawienia dowodu odlotu z Turcji. Jednak ta sytuacja nie trwała długo. Kilka (zagranicznych) pojazdów mogło przekroczyć granicę (kwiecień 2026), ale dopiero po tym, jak ich ambasada napisała list do tureckiego MSZ z prośbą o wyjątek specjalnie dla nich. Zatem nie można (jeszcze) uznać tego przejścia za realną trasę do/z Półwyspu Arabskiego.\",\"ru\":\"Официально (по решению Турции) этот пункт пропуска предназначен только для граждан Турции и Сирии. Однако после закрытия границ Ирака и Кувейта во время войны с Ираном в 2026 году он вскоре вновь открылся для граждан других стран, выезжающих из Сирии, при условии предъявления документов об обратном рейсе из Турции, но это продлилось недолго.\\nНесколько (иностранных) автомобилей смогли пересечь границу (в апреле 2026 года), но только после того, как их посольство направило письмо в министерство иностранных дел Турции с просьбой о предоставлении им исключения.\\nПоэтому пока этот маршрут не считается жизнеспособным путем на/с Аравийского полуострова.\"},\"geohash\":\"sy6n4gwq\",\"updatedAt\":{\"_seconds\":1787925551,\"_nanoseconds\":270000000}}}]}]}]}],null],null],null]},[null,[\"$\",\"$La\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"border_post\",\"children\",\"$b\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lc\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$La\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"border_post\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lc\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/7cca8e2c5137bd71.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/718ee59ff2172a97.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"link\",\"2\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/3c604fe64a268f9f.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}]],[\"$\",\"html\",null,{\"lang\":\"en\",\"children\":[\"$\",\"body\",null,{\"className\":\"__className_f367f3\",\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$Le\",null,{\"children\":[\"$\",\"$La\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\"],\"error\":\"$f\",\"errorStyles\":[],\"errorScripts\":[],\"template\":[\"$\",\"$Lc\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":[\"$\",\"div\",null,{\"className\":\"min-h-sc
