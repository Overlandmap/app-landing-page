ks/152-3ae71cc5a537bc6a.js\",\"185\",\"static/chunks/app/layout-8ce85eb4fbfa0040.js\"],\"LanguageProvider\"]\ne:I[2572,[\"152\",\"static/chunks/152-3ae71cc5a537bc6a.js\",\"185\",\"static/chunks/app/layout-8ce85eb4fbfa0040.js\"],\"ColorSchemeProvider\"]\nf:I[376,[\"601\",\"static/chunks/app/error-b3e9baccacd1beb6.js\"],\"default\"]\n11:I[1060,[],\"\"]\nb:[\"id\",\"0OWDO48nJ8OqAdSiNquA\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L5\",null,{\"buildId\":\"95f9d871d82a8a81\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"border_post\",\"0OWDO48nJ8OqAdSiNquA\",\"\"],\"initialTree\":[\"\",{\"children\":[\"border_post\",{\"children\":[[\"id\",\"0OWDO48nJ8OqAdSiNquA\",\"d\"],{\"children\":[\"__PAGE__?{\\\"id\\\":\\\"0OWDO48nJ8OqAdSiNquA\\\"}\",{}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"border_post\",{\"children\":[[\"id\",\"0OWDO48nJ8OqAdSiNquA\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L6\",[\"$\",\"$L7\",null,{\"children\":[\"$\",\"main\",null,{\"className\":\"h-screen relative\",\"children\":[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"div\",null,{\"className\":\"h-screen flex items-center justify-center\",\"children\":\"Loading border post...\"}],\"children\":[\"$\",\"$L9\",null,{\"initialBorderPost\":\"0OWDO48nJ8OqAdSiNquA\",\"initialBorderPostData\":{\"id\":\"0OWDO48nJ8OqAdSiNquA\",\"is_open\":3,\"countries\":\"JOR-PSX\",\"location\":{\"_latitude\":31.8738717,\"_longitude\":35.5409112},\"comment_translations\":{\"en\":\"Only pedestrians (and bicycles) are allowed to cross, no motor vehicles.\\nIf you'd like to visit Israel from Jordan, this is worth knowing:\\nThis border is controlled by the Israelis, but they stamp you on a separate piece of paper, and on the Syrian side they don't stamp you out, so if you come back to Syria using this same border post, there will be no trace of your visit to Israel in your passport (which is important for some countries such as Iran or Sudan).\\nNote that Jordanian visas are not available at this border: if you're crossing from Israel, you'll need to have purchased an e-visa beforehand.\",\"fr\":\"Seuls les piétons (et les cyclistes) sont autorisés à franchir la frontière ; aucun véhicule motorisé n'est autorisé.\\n\\nSi vous souhaitez vous rendre en Israël depuis la Jordanie, voici quelques informations utiles :\\n\\nCette frontière est contrôlée par les Israéliens, mais un tampon est apposé sur un document séparé. Du côté syrien, aucun tampon n'est apposé sur votre passeport. Ainsi, si vous retournez en Syrie par ce même poste frontière, votre passage en Israël ne fera l'objet d'aucune mention dans votre passeport (ce qui est important pour certains pays comme l'Iran ou le Soudan).\\n\\nVeuillez noter que les visas jordaniens ne sont pas délivrés à cette frontière : si vous traversez la frontière depuis Israël, vous devez avoir obtenu un visa électronique au préalable.\",\"de\":\"Nur Fußgänger (und Fahrräder) dürfen die Grenze überqueren, Kraftfahrzeuge sind nicht erlaubt.\\nWenn Sie von Jordanien nach Israel reisen möchten, sollten Sie Folgendes wissen: Die Grenze wird zwar von Israel kontrolliert, aber Ihr Einreisestempel wird auf einem separaten Blatt Papier angebracht. Auf syrischer Seite erhalten Sie keinen Ausreisestempel. Wenn Sie also über denselben Grenzübergang nach Syrien zurückkehren, findet sich kein Hinweis auf Ihren Israel-Besuch in Ihrem Pass (was für Länder wie Iran oder Sudan wichtig ist). Bitte beachten Sie, dass an dieser Grenze keine jordanischen Visa erhältlich sind. Wenn Sie aus Israel einreisen, benötigen Sie ein zuvor beantragtes E-Visum.\",\"it\":\"L'attraversamento è consentito solo ai pedoni (e alle biciclette), non ai veicoli a motore.\\nSe desiderate visitare Israele dalla Giordania, è importante sapere questo:\\nQuesto confine è controllato dagli israeliani, ma vi timbrano su un foglio di carta separato, e sul lato siriano non vi timbrano l'uscita, quindi se tornate in Siria passando per questo stesso valico di frontiera, non ci sarà traccia della vostra visita in Israele sul vostro passaporto (il che è importante per alcuni paesi come l'Iran o il Sudan).\\nSi noti che i visti giordani non sono disponibili a questo confine: se attraversate da Israele, dovrete aver acquistato un visto elettronico in anticipo.\",\"es\":\"Solo se permite el cruce a peatones (y bicicletas), no a vehículos motorizados.\\nSi desea visitar Israel desde Jordania, le conviene saber lo siguiente:\\nEsta frontera está controlada por los israelíes, pero le sellan en un papel aparte, y en el lado sirio no le sellan la salida. Por lo tanto, si regresa a Siria por este mismo puesto fronterizo, no habrá rastro de su visita a Israel en su pasaporte (lo cual es importante para algunos países como Irán o Sudán).\\nTenga en cuenta que no se ofrecen visados jordanos en esta frontera: si cruza desde Israel, deberá adquirir un visado electrónico con antelación.\",\"pt\":\"Somente pedestres (e bicicletas) podem atravessar, veículos motorizados não.\\nSe você quiser visitar Israel vindo da Jordânia, é importante saber o seguinte:\\nEsta fronteira é controlada pelos israelenses, mas eles carimbam seu passaporte em um papel separado, e do lado sírio eles não carimbam sua saída, então se você voltar para a Síria usando este mesmo posto de fronteira, não haverá nenhum registro da sua visita a Israel no seu passaporte (o que é importante para alguns países como Irã ou Sudão).\\nObserve que vistos jordanianos não estão disponíveis nesta fronteira: se você estiver atravessando vindo de Israel, precisará ter comprado um visto eletrônico com antecedência.\",\"nl\":\"Alleen voetgangers (en fietsers) mogen de grens oversteken, geen motorvoertuigen.\\n\\nAls u vanuit Jordanië naar Israël wilt reizen, is het goed om te weten:\\nDeze grens wordt gecontroleerd door de Israëliërs, maar ze stempelen u op een apart document. Aan de Syrische kant stempelen ze u niet uit, dus als u via dezelfde grenspost terugkeert naar Syrië, zal er geen spoor van uw bezoek aan Israël in uw paspoort staan (wat belangrijk is voor sommige landen zoals Iran of Soedan).\\n\\nLet op: Jordaanse visa zijn niet verkrijgbaar aan deze grens: als u vanuit Israël reist, moet u vooraf een e-visum hebben aangevraagd.\",\"pl\":\"Przejście przez granicę jest dozwolone tylko dla pieszych (i rowerzystów), pojazdy mechaniczne są zabronione.\\nJeśli chcesz odwiedzić Izrael z Jordanii, warto wiedzieć:\\nGranica ta jest kontrolowana przez Izraelczyków, ale pieczątka jest umieszczana na osobnej kartce papieru, a po stronie syryjskiej nie jest ona wydawana, więc jeśli wrócisz do Syrii przez ten sam punkt graniczny, w Twoim paszporcie nie będzie śladu Twojej wizyty w Izraelu (co jest ważne w przypadku niektórych krajów, takich jak Iran czy Sudan).\\nPamiętaj, że wizy jordańskie nie są dostępne na tej granicy: jeśli przekraczasz granicę z Izraela, musisz wcześniej wykupić wizę elektroniczną.\",\"ru\":\"Пересечение границы разрешено только пешеходам (и велосипедистам), автомобили запрещены.\\nЕсли вы хотите посетить Израиль из Иордании, стоит знать следующее:\\nЭта граница контролируется Израилем, но они ставят штамп на отдельном листе бумаги, а на сирийской стороне штампа о выезде не ставят, поэтому, если вы вернетесь в Сирию через этот же пограничный пункт, в вашем паспорте не будет никаких следов вашего визита в Израиль (что важно для некоторых стран, таких как Иран или Судан).\\nОбратите внимание, что иорданские визы на этой границе не выдаются: если вы пересекаете границу из Израиля, вам необходимо заранее приобрести электронную визу.\"},\"geohash\":\"sv9m2f2n\",\"comment\":\"Only pedestrians (and bicycles) are allowed to cross, no motor vehicles.\\nIf you'd like to visit Israel from Jordan, this is worth knowing:\\nThis border is controlled by the Israelis, but they stamp you on a separate piece of paper, and on the Jordan side they don't stamp you out (even though they make you pay the exit tax, 10 JOD), so if you return to Jordan using this same border post, there will be no trace of your visit to Israel in your passport (which is important for some countries such as Iran or Sudan).\\nNote that Jordanian visas are not available at this border: if this is your first entry into Jordan, then you'll need to have purchased an e-visa beforehand.\",\"name\":\"King Hussein Bridge / Allenby Bridge\",\"updatedAt\":{\"_seconds\":1774878923,\"_nanoseconds\":907000000}}}]}]}]}],null],null],null]},[null,[\"$\",\"$La\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"border_post\",\"children\",\"$b\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lc\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$La\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"border_post\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lc\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/7cca8e2c5137bd71.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/718ee59ff2172a97.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"link\",\"2\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/3c604fe64a268f9f.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}]],[\"$\",\"html\",null,{\"lang\":\"en\",\"children\":[\"$\",\"body\",null,{\"className\":\"__className_f367f3\",\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$Le\",null,{\"children\":[\"$\",\"$La\",null,{\"parallelRouterKey\":\"children\",\"segm
