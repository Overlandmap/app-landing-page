ks/152-3ae71cc5a537bc6a.js\",\"185\",\"static/chunks/app/layout-8ce85eb4fbfa0040.js\"],\"LanguageProvider\"]\ne:I[2572,[\"152\",\"static/chunks/152-3ae71cc5a537bc6a.js\",\"185\",\"static/chunks/app/layout-8ce85eb4fbfa0040.js\"],\"ColorSchemeProvider\"]\nf:I[376,[\"601\",\"static/chunks/app/error-b3e9baccacd1beb6.js\"],\"default\"]\n11:I[1060,[],\"\"]\nb:[\"id\",\"kGSKrpqCNztGRAQ5Z139\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L5\",null,{\"buildId\":\"95f9d871d82a8a81\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"border_post\",\"kGSKrpqCNztGRAQ5Z139\",\"\"],\"initialTree\":[\"\",{\"children\":[\"border_post\",{\"children\":[[\"id\",\"kGSKrpqCNztGRAQ5Z139\",\"d\"],{\"children\":[\"__PAGE__?{\\\"id\\\":\\\"kGSKrpqCNztGRAQ5Z139\\\"}\",{}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"border_post\",{\"children\":[[\"id\",\"kGSKrpqCNztGRAQ5Z139\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L6\",[\"$\",\"$L7\",null,{\"children\":[\"$\",\"main\",null,{\"className\":\"h-screen relative\",\"children\":[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"div\",null,{\"className\":\"h-screen flex items-center justify-center\",\"children\":\"Loading border post...\"}],\"children\":[\"$\",\"$L9\",null,{\"initialBorderPost\":\"kGSKrpqCNztGRAQ5Z139\",\"initialBorderPostData\":{\"id\":\"kGSKrpqCNztGRAQ5Z139\",\"is_open\":2,\"comment\":\"Border post linking Tatopani and Zhangmu on the Araniko highway. It had been the only crossing from Nepal to Tibet from the 1960s until the large earthquake of 2015 destroyed it. From then on, the Rasuwagadhi-Gyirong border took over.\\nThe Kodari border post is normally closed, but it was reopened after the Gyirong road was destroyed (2025 monsoon season).\\nSo it's expected that it will be closed down again after the Gyirong crossing is accessible again.\",\"countries\":\"NPL-CHN\",\"location\":{\"_latitude\":27.9730991,\"_longitude\":85.9631132},\"name\":\"Kodari\",\"comment_translations\":{\"en\":\"Border post linking Tatopani and Zhangmu on the Araniko highway. It had been the only crossing from Nepal to Tibet from the 1960s until the large earthquake of 2015 destroyed it. From then on, the Rasuwagadhi-Gyirong border took over.\\nThe Kodari border post is normally closed, but it was reopened after the Gyirong road was destroyed (2025 monsoon season).\\nSo it's expected that it will be closed down again after the Gyirong crossing is accessible again.\",\"fr\":\"Le poste frontière reliant Tatopani et Zhangmu sur la route d'Araniko était le seul point de passage entre le Népal et le Tibet des années 1960 jusqu'à sa destruction par le séisme de 2015. Depuis lors, le poste frontière de Rasuwagadhi-Gyirong assure la liaison.\\n\\nLe poste frontière de Kodari est normalement fermé, mais il a rouvert après la destruction de la route de Gyirong (pendant la mousson de 2025).\\n\\nIl devrait donc être de nouveau fermé une fois le passage de Gyirong rouvert.\",\"de\":\"Der Grenzübergang Kodari zwischen Tatopani und Zhangmu am Araniko Highway war von den 1960er Jahren bis zu seiner Zerstörung durch das schwere Erdbeben von 2015 der einzige Übergang von Nepal nach Tibet. Seitdem dient der Grenzübergang Rasuwagadhi-Gyirong als solcher.\\nDer Grenzübergang Kodari ist normalerweise geschlossen, wurde aber nach der Zerstörung der Straße nach Gyirong (Monsunzeit 2025) wieder geöffnet.\\nEs ist daher zu erwarten, dass er erneut geschlossen wird, sobald der Grenzübergang Gyirong wieder befahrbar ist.\",\"it\":\"Posto di frontiera che collega Tatopani e Zhangmu sull'autostrada Araniko. Era stato l'unico valico dal Nepal al Tibet dagli anni '60 fino a quando il grande terremoto del 2015 lo distrusse. Da allora in poi, è stato sostituito dal confine Rasuwagadhi-Gyirong.\\nIl posto di frontiera di Kodari è normalmente chiuso, ma è stato riaperto dopo la distruzione della strada di Gyirong (stagione dei monsoni del 2025).\\nSi prevede quindi che verrà nuovamente chiuso non appena il valico di Gyirong sarà nuovamente accessibile.\",\"es\":\"Puesto fronterizo que une Tatopani y Zhangmu en la carretera de Araniko. Fue el único cruce entre Nepal y el Tíbet desde la década de 1960 hasta que el gran terremoto de 2015 lo destruyó. A partir de entonces, la frontera entre Rasuwagadhi y Gyirong tomó el relevo.\\nEl puesto fronterizo de Kodari suele estar cerrado, pero se reabrió tras la destrucción de la carretera de Gyirong (temporada de monzones de 2025).\\nPor lo tanto, se espera que vuelva a cerrarse cuando el cruce de Gyirong vuelva a ser accesible.\",\"pt\":\"Posto fronteiriço que liga Tatopani e Zhangmu na rodovia Araniko. Era a única passagem do Nepal para o Tibete desde a década de 1960 até que o grande terremoto de 2015 a destruiu. A partir de então, a fronteira Rasuwagadhi-Gyirong assumiu essa função.\\nO posto fronteiriço de Kodari normalmente fica fechado, mas foi reaberto após a destruição da estrada de Gyirong (temporada de monções de 2025).\\nPortanto, espera-se que seja fechado novamente assim que a passagem de Gyirong estiver acessível novamente.\",\"nl\":\"Grenspost die Tatopani en Zhangmu verbindt aan de Araniko-snelweg. Het was de enige grensovergang van Nepal naar Tibet van de jaren 60 tot de grote aardbeving van 2015 die de post verwoestte. Sindsdien is de grenspost Rasuwagadhi-Gyirong de enige grensovergang.\\n\\nDe grenspost Kodari is normaal gesproken gesloten, maar werd heropend nadat de weg naar Gyirong was verwoest (moessonseizoen 2025).\\n\\nHet is dus te verwachten dat de grenspost weer gesloten zal worden zodra de grensovergang bij Gyirong weer toegankelijk is.\",\"pl\":\"Słup graniczny łączący Tatopani i Zhangmu na autostradzie Araniko. Było to jedyne przejście graniczne z Nepalu do Tybetu od lat 60. XX wieku, aż do zniszczenia go przez silne trzęsienie ziemi w 2015 roku. Od tego czasu funkcję tę przejęła granica Rasuwagadhi-Gyirong.\\nSłup graniczny w Kodari jest zazwyczaj zamknięty, ale został ponownie otwarty po zniszczeniu drogi Gyirong (sezon monsunowy 2025).\\nOczekuje się więc, że zostanie ponownie zamknięty, gdy przejście graniczne w Gyirong będzie ponownie dostępne.\",\"ru\":\"Пограничный пункт, соединяющий Татопани и Чжанму на шоссе Аранико. С 1960-х годов это был единственный пункт пересечения границы из Непала в Тибет, пока его не разрушило сильное землетрясение 2015 года. С тех пор его место занял пограничный пункт Расувагадхи-Гьиронг.\\nПограничный пункт Кодари обычно закрыт, но он был вновь открыт после разрушения дороги на Гиронг (сезон муссонов 2025 года).\\nПоэтому ожидается, что он будет снова закрыт после того, как станет доступен пункт пересечения границы на Гиронг.\"},\"geohash\":\"tuvphhk7\",\"updatedAt\":{\"_seconds\":1769107911,\"_nanoseconds\":609000000}}}]}]}]}],null],null],null]},[null,[\"$\",\"$La\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"border_post\",\"children\",\"$b\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lc\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$La\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"border_post\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lc\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/7cca8e2c5137bd71.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/718ee59ff2172a97.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"link\",\"2\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/3c604fe64a
