ks/152-324a33f0176f6c2e.js\",\"185\",\"static/chunks/app/layout-8ce85eb4fbfa0040.js\"],\"LanguageProvider\"]\ne:I[2572,[\"152\",\"static/chunks/152-324a33f0176f6c2e.js\",\"185\",\"static/chunks/app/layout-8ce85eb4fbfa0040.js\"],\"ColorSchemeProvider\"]\nf:I[376,[\"601\",\"static/chunks/app/error-b3e9baccacd1beb6.js\"],\"default\"]\n11:I[1060,[],\"\"]\nb:[\"id\",\"zWfB7LNKT1IMBU9ZeElb\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L5\",null,{\"buildId\":\"PtA4npsd-H6nky6x8H9Ug\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"border_post\",\"zWfB7LNKT1IMBU9ZeElb\",\"\"],\"initialTree\":[\"\",{\"children\":[\"border_post\",{\"children\":[[\"id\",\"zWfB7LNKT1IMBU9ZeElb\",\"d\"],{\"children\":[\"__PAGE__?{\\\"id\\\":\\\"zWfB7LNKT1IMBU9ZeElb\\\"}\",{}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"border_post\",{\"children\":[[\"id\",\"zWfB7LNKT1IMBU9ZeElb\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L6\",[\"$\",\"$L7\",null,{\"children\":[\"$\",\"main\",null,{\"className\":\"h-screen relative\",\"children\":[\"$\",\"$8\",null,{\"fallback\":[\"$\",\"div\",null,{\"className\":\"h-screen flex items-center justify-center\",\"children\":\"Loading border post...\"}],\"children\":[\"$\",\"$L9\",null,{\"initialBorderPost\":\"zWfB7LNKT1IMBU9ZeElb\",\"initialBorderPostData\":{\"id\":\"zWfB7LNKT1IMBU9ZeElb\",\"is_open\":2,\"comment\":\"As a tourist, you need to look for the immigration offices on either sides of the border, because 99.99% of the traffic is bilateral and they only need to show an ID to cross, so this is very unformal.\\nHave your visa checked and carnet stamped before crossing actual border, where they'll only check for your entry/exit stamps.\\nNote that the large 2-lanes highway is restricted to cars and trucks, motorcycles need to take the smaller road that runs parallel and which is congested with rickshaws.\",\"countries\":\"IND-NPL\",\"location\":{\"_latitude\":26.6446682,\"_longitude\":88.1625578},\"name\":\"Panitanki/Kakarbhitta\",\"comment_translations\":{\"en\":\"As a tourist, you need to look for the immigration offices on either sides of the border, because 99.99% of the traffic is bilateral and they only need to show an ID to cross, so this is very unformal.\\nHave your visa checked and carnet stamped before crossing actual border, where they'll only check for your entry/exit stamps.\\nNote that the large 2-lanes highway is restricted to cars and trucks, motorcycles need to take the smaller road that runs parallel and which is congested with rickshaws.\",\"fr\":\"En tant que touriste, vous devez repérer les bureaux de l'immigration de part et d'autre de la frontière, car la quasi-totalité du trafic est bilatéral et une simple pièce d'identité suffit pour passer. La procédure est donc très informelle.\\n\\nFaites vérifier votre visa et tamponner votre carnet de passage en douane avant de franchir la frontière. Seuls les tampons d'entrée et de sortie seront contrôlés.\\n\\nNotez que la grande route à deux voies est réservée aux voitures et aux camions. Les motos doivent emprunter la route parallèle, plus petite et souvent encombrée de rickshaws.\",\"de\":\"Als Tourist sollten Sie die Einwanderungsbehörden auf beiden Seiten der Grenze aufsuchen, da der Verkehr zu 99,99 % bilateral ist und für die Einreise lediglich ein Ausweis benötigt wird – die Abläufe sind also sehr informell. Lassen Sie Ihr Visum und Ihr Carnet vor dem eigentlichen Grenzübertritt prüfen und abstempeln. Dort werden lediglich Ihre Ein- und Ausreisestempel kontrolliert. Beachten Sie, dass die breite, zweispurige Autobahn nur für Pkw und Lkw zugelassen ist. Motorräder müssen die parallel verlaufende, kleinere Straße benutzen, die oft von Rikschas befahren wird.\",\"it\":\"Come turista, è necessario cercare gli uffici immigrazione su entrambi i lati del confine, perché il 99,99% del traffico è bilaterale e per attraversare è sufficiente mostrare un documento d'identità, quindi è molto informale.\\nFate controllare il visto e timbrare il carnet prima di attraversare il confine vero e proprio, dove controlleranno solo i timbri di ingresso/uscita.\\nSi noti che la grande autostrada a due corsie è riservata ad auto e camion; le motociclette devono prendere la strada parallela più piccola, congestionata dai risciò.\",\"es\":\"Como turista, debe buscar las oficinas de inmigración a ambos lados de la frontera, ya que el 99,99% del tráfico es bilateral y solo necesitan mostrar una identificación para cruzar, lo cual es muy informal.\\nRevise su visa y selle su carnet antes de cruzar la frontera, donde solo verificarán sus sellos de entrada y salida.\\nTenga en cuenta que la autopista de dos carriles está restringida a automóviles y camiones; las motocicletas deben tomar la carretera paralela, que está congestionada por rickshaws.\",\"pt\":\"Como turista, você precisa procurar os escritórios de imigração em ambos os lados da fronteira, porque 99,99% do tráfego é bilateral e eles só precisam mostrar um documento de identidade para atravessar, então é muito informal.\\nVerifique seu visto e carimbe o Carnet antes de cruzar a fronteira propriamente dita, onde eles só verificarão seus carimbos de entrada/saída.\\nObserve que a grande rodovia de duas faixas é restrita a carros e caminhões; as motocicletas precisam usar a estrada menor que corre paralela e que está congestionada com riquixás.\",\"nl\":\"Als toerist moet je de immigratiekantoren aan beide zijden van de grens opzoeken, omdat 99,99% van het verkeer tweezijdig is en je alleen een identiteitsbewijs hoeft te laten zien om de grens over te steken, dus het is erg informeel.\\n\\nLaat je visum controleren en je carnet afstempelen voordat je de grens oversteekt. Daar controleren ze alleen je in- en uitreisstempels.\\n\\nHoud er rekening mee dat de brede tweebaansweg alleen toegankelijk is voor auto's en vrachtwagens. Motorfietsen moeten de kleinere, parallel lopende weg nemen, die vol zit met riksja's.\",\"pl\":\"Jako turysta musisz szukać urzędów imigracyjnych po obu stronach granicy, ponieważ 99,99% ruchu odbywa się w obie strony i wymaga jedynie okazania dokumentu tożsamości, co jest bardzo nieformalne.\\nPrzed przekroczeniem granicy sprawdź wizę i podstempluj karnet. Tam sprawdzą tylko pieczątki wjazdowe i wyjazdowe.\\nPamiętaj, że duża, dwupasmowa autostrada jest przeznaczona wyłącznie dla samochodów osobowych i ciężarowych, a motocykle muszą korzystać z mniejszej, równoległej drogi, na której często jeżdżą riksze.\",\"ru\":\"Туристам необходимо искать иммиграционные пункты по обе стороны границы, поскольку 99,99% движения является двусторонним, и для пересечения границы достаточно предъявить удостоверение личности, поэтому это очень неформально.\\nПроверьте визу и поставьте штамп в карнете до пересечения границы, где проверят только штампы въезда/выезда.\\nОбратите внимание, что большая двухполосная автомагистраль предназначена только для легковых автомобилей и грузовиков, мотоциклам необходимо ехать по меньшей дороге, которая идет параллельно и которая перегружена рикшами.\"}}}]}]}]}],null],null],null]},[null,[\"$\",\"$La\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"border_post\",\"children\",\"$b\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lc\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$La\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"border_post\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lc\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/7cca8e
