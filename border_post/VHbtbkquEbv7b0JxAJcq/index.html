 2025 suite à la destruction de la route, le poste frontière de Kodari a depuis rouvert ses portes.\\n\\nUne fois les travaux de réparation terminés, il redeviendra le seul point de passage touristique entre le Tibet et le Népal.\",\"de\":\"Der Grenzübergang wurde 2025 aufgrund der Zerstörung der Straße vorübergehend geschlossen. Inzwischen ist der Grenzübergang Kodari wieder in Betrieb. Nach der Instandsetzung wird er wieder der einzige Grenzübergang zwischen Tibet und Nepal für Touristen sein.\",\"it\":\"Chiuso temporaneamente nel 2025, quando la strada fu distrutta. Nel frattempo, il valico di frontiera di Kodari è stato riattivato.\\nUna volta riparato, tornerà ad essere l'unico valico tra Tibet e Nepal per i turisti.\",\"es\":\"Cerrado temporalmente en 2025 cuando la carretera fue destruida. Mientras tanto, el puesto fronterizo de Kodari ha sido reactivado.\\nTras su reparación, volverá a ser el único cruce entre el Tíbet y Nepal para turistas.\",\"pt\":\"Fechado temporariamente em 2025, quando a estrada foi destruída. Entretanto, o posto fronteiriço de Kodari foi reativado.\\nApós ser consertado, voltará a ser a única passagem entre o Tibete e o Nepal para turistas.\",\"nl\":\"De grenspost Kodari werd in 2025 tijdelijk gesloten vanwege wegverwoesting. Inmiddels is de grenspost Kodari weer in gebruik genomen.\\n\\nNa de reparatie zal het opnieuw de enige grensovergang tussen Tibet en Nepal voor toeristen zijn.\",\"pl\":\"Tymczasowo zamknięta w 2025 roku, kiedy droga została zniszczona. W międzyczasie ponownie uruchomiono posterunek graniczny w Kodari.\\nPo naprawie ponownie będzie to jedyne przejście graniczne między Tybetem a Nepalem dla turystów.\",\"ru\":\"Временно закрыт в 2025 году из-за разрушения дороги. Тем временем пограничный пункт Кодари был вновь введен в эксплуатацию.\\nПосле его ремонта он снова станет единственным пунктом пересечения границы между Тибетом и Непалом для туристов.\"},\"geohash\":\"tvh8ygfq\",\"updatedAt\":{\"_seconds\":1769107909,\
