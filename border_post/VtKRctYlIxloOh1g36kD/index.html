:\\n100 MRU community tax\\n200 MRU/pp for the national park\\n55€ for the eVisa\\nInsurance available at the border.\",\"comment_translations\":{\"en\":\"The road is difficult during the rains, avoid.\\nThere's a toll to cross the bridge: 4000 CFA (motorbike), 10000CFA (car) or 20000 (truck).\\nEntering Senegal:\\nPasse-avant is valid for 48h, sometimes 5 days (5000-6000 CFA); do not pay more !\\nWith a CdP, you have to get it stamped in Dakar within 48 hours.\\nCarte brune insurance available here. It's cheaper in St-Louis, but you risk being pulled over and fined while driving there.\\nEntering Mauritania (everything to be paid in cash) :\\n100 MRU community tax\\n200 MRU/pp for the national park\\n55€ for the eVisa\\nInsurance available at the border.\",\"fr\":\"La route est difficile pendant la saison des pluies, à éviter.\\n\\nLe passage du pont est payant : 4 000 CFA (moto), 10 000 CFA (voiture) ou 20 000 CFA (camion).\\n\\nEntrée au Sénégal :\\n\\nLe laissez-passer est valable 48 h, parfois 5 jours (5 000 à 6 000 CFA) ; ne payez pas plus !\\n\\nAvec un CDP, vous devez le faire tamponner à Dakar dans les 48 heures.\\n\\nL’assurance « carte brune » est disponible ici. Elle est moins chère à Saint-Louis, mais vous risquez d’être contrôlé et verbalisé.\\n\\nEntrée en Mauritanie (tout est à payer en espèces) :\\n\\n100 MRU de taxe communautaire\\n200 MRU/personne pour le parc national\\n55 € pour le visa électronique\\nAssurance disponible à la frontière.\",\"de\":\"Die Straße ist bei Regen schwer befahrbar, meiden Sie sie.\\nFür die Brückenüberquerung wird eine Mautgebühr erhoben: 4000 CFA (Motorrad), 10000 CFA (Pkw) oder 20000 CFA (Lkw).\\nEinreise nach Senegal: Der Passe-avant ist 48 Stunden, manchmal 5 Tage gültig (5000–6000 CFA); zahlen Sie nicht mehr!\\nMit einem CdP (Certificate de Passeau) müssen Sie diesen innerhalb von 48 Stunden in Dakar abstempeln lassen.\\nEine Kfz-Versicherung (Carte Brune) ist hier erhältlich. In St. Louis ist sie günstiger, aber dort riskieren Sie, angehalten und mit einem Bußgeld belegt zu werden.\\nEinreise nach Mauretanien (alles bar zu bezahlen):\\n100 MRU Gemeinschaftssteuer\\n200 MRU pro Person für den Nationalpark\\n55 € für das e-Visum\\nVersicherung an der Grenze erhältlich.\",\"it\":\"La strada è difficile durante le piogge, evitatela.\\nC'è un pedaggio per attraversare il ponte: 4000 CFA (moto), 10000 CFA (auto) o 20000 (camion).\\nIngresso in Senegal:\\nIl Passe-avant è valido per 48 ore, a volte 5 giorni (5000-6000 CFA); non pagate di più!\\nCon un Passe-avant, dovete farlo timbrare a Dakar entro 48 ore.\\nL'assicurazione Carte Brune è disponibile qui. È più economica a St. Louis, ma rischiate di essere fermati e multati mentre guidate lì.\\nIngresso in Mauritania (tutto da pagare in contanti):\\n100 MRU di tassa comunitaria\\n200 MRU/persona per il parco nazionale\\n55 € per il visto elettronico\\nAssicurazione disponibile alla frontiera.\",\"es\":\"El camino es difícil cuando llueve, así que evítelo.\\nHay un peaje para cruzar el puente: 4000 CFA (moto), 10000 CFA (coche) o 20000 CFA (camión).\\nEntrada a Senegal:\\nEl pase de avante es válido por 48 horas, a veces por 5 días (5000-6000 CFA); ¡no pague más!\\nCon un CdP, debe sellarlo en Dakar en un plazo de 48 horas.\\nHay seguro de tarjeta brune disponible aquí. Es más barato en Saint-Louis, pero corre el riesgo de ser detenido y multado conduciendo allí.\\nEntrada a Mauritania (todo a pagar en efectivo):\\n100 MRU de impuesto comunitario\\n200 MRU/persona para el parque nacional\\n55 € para la visa electrónica\\nSeguro disponible en la frontera.\",\"pt\":\"A estrada fica difícil durante as chuvas, evite.\\nHá um pedágio para atravessar a ponte: 4000 CFA (motocicleta), 10000 CFA (carro) ou 20000 CFA (caminhão).\\nEntrando no Senegal:\\nO Passe-avant é válido por 48 horas, às vezes 5 dias (5000-6000 CFA); não pague mais!\\n\\nCom um CDP, você precisa carimbá-lo em Dakar em até 48 horas.\\nSeguro Carte Brune disponível aqui. É mais barato em St-Louis, mas você corre o risco de ser parado e multado enquanto dirige lá.\\nEntrando na Mauritânia (tudo a ser pago em dinheiro):\\n100 MRU de taxa comunitária\\n200 MRU/pessoa para o parque nacional\\n55€ para o eVisa\\nSeguro disponível na fronteira.\",\"nl\":\"De weg is moeilijk begaanbaar tijdens regenachtig weer, vermijd deze route.\\n\\nEr is tol voor de brug: 4000 CFA (motor), 10000 CFA (auto) of 20000 CFA (vrachtwagen).\\n\\nSenegal binnenrijden:\\nEen Passe-avant is 48 uur geldig, soms 5 dagen (5000-6000 CFA); betaal niet meer!\\n\\nMet een CdP moet je deze binnen 48 uur in Dakar laten afstempelen.\\n\\nEen Carte Bruné-verzekering is hier verkrijgbaar. In Saint-Louis is het goedkoper, maar je loopt het risico aangehouden te worden en een boete te krijgen.\\n\\nMauritanië binnenrijden (alles contant te betalen):\\n100 MRU gemeentebelasting\\n200 MRU per persoon voor het nationale park\\n55 € voor het e-visum\\nVerzekering verkrijgbaar aan de grens.\",\"pl\":\"Droga jest trudna w czasie deszczu, należy jej unikać.\\nPrzejazd przez most jest płatny: 4000 CFA (motocykl), 10000 CFA (samochód) lub 20000 (ciężarówka).\\nWjazd do Senegalu:\\nPasse-avant jest ważny przez 48 godzin, czasami 5 dni (5000-6000 CFA); nie płać więcej!\\nZ kartą CdP musisz uzyskać pieczątkę w Dakarze w ciągu 48 godzin.\\nUbezpieczenie Carte brune dostępne tutaj. Jest tańsze w St. Louis, ale ryzykujesz zatrzymanie i mandat podczas jazdy.\\nWjazd do Mauretanii (płatność gotówką):\\n100 MRU podatku lokalnego\\n200 MRU/os. za wstęp do parku narodowego\\n55 EUR za e-wizę\\nUbezpieczenie dostępne na granicy.\",\"ru\":\"Дорога в дождливую погоду труднопроходима, избегайте её.\\nЗа проезд по мосту взимается плата: 4000 CFA (мотоцикл), 10000 CFA (легковой автомобиль) или 20000 CFA (грузовик).\\nВъезд в Сенегал:\\nPasse-avant действителен в течение 48 часов, иногда 5 дней (5000-6000 CFA); не платите больше!\\nС CdP необходимо получить штамп в Дакаре в течение 48 часов.\\nЗдесь можно оформить страховку Carte brune. В Сен-Луи она дешевле, но есть риск быть остановленным и оштрафованным за рулём.\\nВъезд в Мавританию (все оплачивается наличными):\\n100 MRU муниципальный налог\\n200 MRU с человека за посещение национального парка\\n55€ за электронную визу\\nСтраховка доступна на границе.\"},\"geohash\":\"eduk4rwg\",\"updatedAt\":{\"_seconds\":1769107909,\"_nanoseconds\":656000000}}}]}]}]}],null],null],null]},[null,[\"$\",\"$La\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"border_post\",\"children\",\"$b\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lc\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$La\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"border_post\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lc\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/7cca8e2c5137bd71.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/718ee59ff2172a97.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"link\",\"2\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/3c604fe64a268f9f.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}]],[\"$\",\"html\",null,{\"lang\":\"en\",\"children\":[\"$\",\"body\",null,{\"className\":\"__className_f367f3\",\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$Le\",null,{\"children\":[\"$\",\"$La\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\"],\"error\":\"$f\",\"error
