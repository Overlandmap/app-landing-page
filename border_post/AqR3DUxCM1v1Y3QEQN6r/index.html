.\",\"fr\":\"Cela ressemble à un passage de frontière classique. En venant de Russie, vous avez besoin du visa approprié (voir les informations par pays).\\n\\nSi vous entrez en Abkhazie par ce point, vous devez également en sortir ; le passage de la Russie vers l'Abkhazie puis la Géorgie n'est pas autorisé.\",\"de\":\"Es fühlt sich an wie ein normaler Grenzübergang. Bei Einreise aus Russland benötigen Sie das entsprechende Visum (siehe Länderinformationen). Wenn Sie hier nach Abchasien einreisen, müssen Sie auch hier wieder ausreisen. Die Einreise von Russland über Abchasien nach Georgien ist nicht gestattet.\",\"it\":\"Sembra un normale attraversamento di frontiera. Provenendo dalla Russia, è necessario il visto appropriato (vedi informazioni sul paese).\\nSe entri in Abkhazia da qui, devi anche uscirne; attraversare dalla Russia all'Abkhazia e alla Georgia non è consentito.\",\"es\":\"Parece un cruce de frontera normal. Si vienes de Rusia, necesitas el visado correspondiente (consulta la información del país).\\nSi entras en Abjasia por aquí, también debes salir por aquí. No está permitido cruzar de Rusia a Abjasia y a Georgia.\",\"pt\":\"Parece uma travessia de fronteira normal. Vindo da Rússia, você precisa do visto apropriado (veja as informações sobre o país).\\nSe você entrar na Abkházia por aqui, também deverá sair por aqui, pois a travessia da Rússia para a Abkházia e depois para a Geórgia não é permitida.\",\"nl\":\"Het voelt als een normale grensovergang. Komend vanuit Rusland heb je het juiste visum nodig (zie landinformatie).\\n\\nAls je Abchazië hier binnenkomt, moet je het ook hier weer verlaten; het is niet toegestaan om van Rusland naar Abchazië en vervolgens naar Georgië te reizen.\",\"pl\":\"To jak normalne przekraczanie granicy. Jadąc z Rosji, potrzebujesz odpowiedniej wizy (zobacz informacje o kraju).\\nJeśli wjeżdżasz tutaj do Abchazji, musisz również stąd wyjechać. Przejazd z Rosji do Abchazji i Gruzji nie jest dozwolony.\",\"ru\":\"Ощущения
